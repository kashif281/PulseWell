name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nura
          POSTGRES_PASSWORD: nura_ci
          POSTGRES_DB: nura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nura -d nura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nura:nura_ci@localhost:5432/nura_test?schema=public
      JWT_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      FRONTEND_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: /api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Run tests
        run: npm test

      - name: Build applications
        run: npm run build
